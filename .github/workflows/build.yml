name: 'Build Project'

on:
  pull_request:

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v6'
      - name: 'Install Java Development Kit (25)'
        uses: 'actions/setup-java@v5'
        with:
          java-version: '25'
          distribution: 'corretto'
      - name: 'Assign Permissions'
        run: 'chmod +x ./gradlew'
      - name: 'Build (Gradle)'
        run: './gradlew build'
      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'Built Artifact'
          path: 'build/libs/*.jar'
          retention-days: 3
