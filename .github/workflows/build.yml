name: 'Build Project'
on:
  push:
    branches: [ 'ver/latest' ]
  pull_request:
    branches: [ 'ver/latest' ]
jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - name: 'Install Java Development Kit (23)'
        uses: 'actions/setup-java@v4'
        with:
          java-version: '23'
          distribution: 'temurin'
      - name: 'Assign Permissions'
        run: 'chmod +x ./gradlew'
      - name: 'Build (Gradle)'
        run: './gradlew build'
      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'Built Artifact'
          path: 'build/libs/*.jar'
