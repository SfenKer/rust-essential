name: 'Build Project'
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v3'
      - name: 'Install Java Development Kit (21)'
        uses: 'actions/setup-java@v3'
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: 'Assign Permissions'
        run: 'chmod +x ./gradlew'
      - name: 'Build (Gradle)'
        run: './gradlew build'
      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@v3'
        with:
          name: 'Built Artifact'
          path: 'build/libs/*.jar'