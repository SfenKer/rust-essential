name: 'Publish Release'
on:
  release:
    types: [ published ]

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0
      - name: 'Install Java Development Kit (25)'
        uses: 'actions/setup-java@v5'
        with:
          java-version: '25'
          distribution: 'corretto'
      - name: 'Assign Permissions'
        run: 'chmod +x ./gradlew'
      - name: 'Build (Gradle)'
        run: './gradlew build'
      - name: 'Update Release with Built Artifact'
        uses: 'softprops/action-gh-release@v2'
        with:
          files: 'build/libs/*.jar'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  changelog:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0
      - name: 'Update Release Changelog'
        uses: 'softprops/action-gh-release@v2'
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
