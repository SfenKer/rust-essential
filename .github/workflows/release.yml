name: 'Publish Release'
on:
  release:
    types: [ published ]

permissions:
  contents: write
  pull-requests: read
  packages: write

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0
      - name: 'Install Java Development Kit (25)'
        uses: 'actions/setup-java@v5'
        with:
          java-version: '25'
          distribution: 'corretto'
      - name: 'Assign Permissions'
        run: 'chmod +x ./gradlew'
      - name: 'Build (Gradle)'
        run: './gradlew build'
      - name: 'Update Release with Built Artifact'
        uses: 'softprops/action-gh-release@v3'
        with:
          files: 'build/libs/*.jar'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Upload Artifact'
        uses: 'actions/upload-artifact@v7'
        with:
          name: 'Built Artifact'
          path: 'build/libs/*.jar'
          retention-days: 3
  changelog:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v6'
        with:
          fetch-depth: 0
      - name: 'Update Release Changelog'
        uses: 'softprops/action-gh-release@v3'
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  docker:
    needs: [ 'build' ]
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v6'
      - name: "Repository Owner"
        run: |
          REPOSITORY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REPOSITORY_OWNER=$REPOSITORY_OWNER" >> $GITHUB_ENV
      - name: 'Download Artifact'
        uses: 'actions/download-artifact@v8'
        with:
          name: 'Built Artifact'
          path: '.'
      - name: 'Setup Docker Buildx'
        uses: 'docker/setup-buildx-action@v4'
      - name: 'Login to GitHub Container Registry'
        uses: 'docker/login-action@v4'
        with:
          registry: 'ghcr.io'
          username: '${{ env.REPOSITORY_OWNER }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: 'Build & Push Docker image'
        uses: 'docker/build-push-action@v7'
        with:
          context: '.'
          push: 'true'
          tags: |
            ghcr.io/${{ env.REPOSITORY_OWNER }}/rust-essential:latest
            ghcr.io/${{ env.REPOSITORY_OWNER }}/rust-essential:${{ github.ref_name }}
