[versions]
jda-core = "6.3.1"
jda-commands = "4.0.1"

gson = "2.13.2"
guava = "33.5.0-jre"

sqlite = "3.51.2.0"
hikaricp = "7.0.2"
hibernate = "7.2.6.Final"
jakarta = "3.2.0"

oshi = "6.10.0"
unirest = "4.7.4"
logback = "1.5.32"

rome = "2.1.0"
source-query = "1.2.2"

lombok = "1.18.42"
jetbrains-annotations = "26.1.0"

[libraries]
jda-core = { group = "net.dv8tion", name = "JDA", version.ref = "jda-core" }
jda-commands = { group = "io.github.kaktushose", name = "jda-commands", version.ref = "jda-commands" }

gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

sqlite-driver = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
